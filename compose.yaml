services:
  db:
    image: postgis/postgis:17-3.6-alpine
    container_name: swapy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: swapy_dev_password
      POSTGRES_DB: swapy
    ports:
      - "5432:5432"
    volumes:
      - swapy-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swapy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  swapy-pgdata: